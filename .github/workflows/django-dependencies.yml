name: Prepare Django test dependencies
on:
  push:
    branches: [family-map-explorer]
    paths: ['.github/workflows/django-dependencies.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve supported backend packages
        run: |
          python -m venv /tmp/family-venv
          /tmp/family-venv/bin/pip install 'Django==5.2.18' 'djangorestframework>=3.16,<4' 'dj-database-url>=3,<4' 'gunicorn>=23,<24' 'whitenoise>=6.9,<7' 'cloudinary>=1.44,<2' 'Pillow>=11,<13' 'psycopg[binary]>=3.2,<4' 'django-cors-headers>=4.7,<5'
          mkdir /tmp/wheels
          /tmp/family-venv/bin/pip freeze > /tmp/wheels/requirements.lock
          /tmp/family-venv/bin/pip download --only-binary=:all: -r /tmp/wheels/requirements.lock -d /tmp/wheels
      - uses: actions/upload-artifact@v5
        with:
          name: django-test-wheels
          path: /tmp/wheels
          retention-days: 7
