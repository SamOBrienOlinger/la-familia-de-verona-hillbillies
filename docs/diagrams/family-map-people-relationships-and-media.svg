<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 483 688" width="483" height="688" role="img" aria-labelledby="erd-title erd-desc"><title id="erd-title">Family map people, relationships and media</title><desc id="erd-desc">Charts group people and relationships. Each relationship has a source and a target person. Media can be associated with multiple people.</desc><metadata data-format="mermaid">erDiagram
    accTitle: Family map people, relationships and media
    accDescr: Charts group people and relationships. Each relationship has a source and a target person. Media can be associated with multiple people.
    Chart ||..o{ Person : groups
    Chart ||..o{ Relationship : contains
    Person ||..o{ Relationship : source
    Person ||..o{ Relationship : target
    Person }o..o{ Media : "appears in"

    Chart {
        string id PK
        string label
        int revision
    }
    Person {
        string id PK
        string chart_id FK
        string name
        int generation
    }
    Relationship {
        string id PK
        string chart_id FK
        string source_id FK
        string target_id FK
        string kind
    }
    Media {
        string id PK
        string kind
        string caption
    }</metadata><style>:root {
  --panel:#f7fafc; --border:#c7d8e4; --heading:#14354b; --accent:#128276;
  --card:#174b62; --card-title:#fff; --text:#183448; --muted:#486278;
  --row:#fff; --stripe:#edf5f9; --rule:#9ab7c9; --line:#486980;
  --label-bg:#e2f3ee; --label-text:#195649;
}
@media (prefers-color-scheme:dark) {
  :root {
